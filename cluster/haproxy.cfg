# The router of a managed ISOGrid high-availability instance, for three nodes
# named pg1, pg2 and pg3.
global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout server 30m
    timeout connect 4s
    timeout check 3s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold other 5s
    hold refused 5s
    hold nx 5s
    hold timeout 5s

frontend health
    bind *:8404
    mode http
    monitor-uri /healthz

listen primary
    bind *:5432
    option httpchk GET /leader
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008 resolvers docker init-addr none
    server pg2 pg2:5432 check port 8008 resolvers docker init-addr none
    server pg3 pg3:5432 check port 8008 resolvers docker init-addr none

listen replicas
    bind *:5433
    option httpchk GET /replica
    http-check expect status 200
    balance roundrobin
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
    server pg3 pg3:5432 check port 8008
